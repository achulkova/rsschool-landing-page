<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee House</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="container">
            <div class="header-menu">

                <a href="#" class="logo">
                    <img src="assets/logo.svg" alt="Coffee House">
                </a>

                <nav class="nav">
                    <a href="#favorite-coffee">Favorite coffee</a>
                    <a href="#about">About</a>
                    <a href="#mobile-app">Mobile app</a>
                    <a href="#contacts">Contact us</a>
                </nav>

                <div class="header-actions">

                    <div class="theme-switch">
                        <button
                            class="theme-button light-theme"
                            type="button"
                            aria-label="Switch to light theme"
                        >
                            <img src="assets/sun.svg" alt="">
                        </button>

                        <button
                            class="theme-button dark-theme"
                            type="button"
                            aria-label="Switch to dark theme"
                        >
                            <img src="assets/moon.svg" alt="">
                        </button>
                    </div>

                    <a href="menu.html" class="coffee-menu">
                        <span>Menu</span>
                        <img src="assets/coffee-cup.svg" alt="">
                    </a>

                </div>

            </div>
        </div>
    </header>

    <script src="js/script.js"></script>

</body>

</html>
